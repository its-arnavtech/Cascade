apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-executor-service
  namespace: cascade-system
  labels:
    app: chaos-executor-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-executor-targets
  namespace: cascade-targets
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos", "networkchaos", "stresschaos"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-executor-targets
  namespace: cascade-targets
subjects:
  - kind: ServiceAccount
    name: chaos-executor-service
    namespace: cascade-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-executor-targets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-executor-crd-reader
  labels:
    app: chaos-executor-service
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["podchaos.chaos-mesh.org", "networkchaos.chaos-mesh.org", "stresschaos.chaos-mesh.org"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-executor-crd-reader
  labels:
    app: chaos-executor-service
subjects:
  - kind: ServiceAccount
    name: chaos-executor-service
    namespace: cascade-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-executor-crd-reader
