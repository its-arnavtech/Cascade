apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema-init
  namespace: cascade-system
  labels:
    app: clickhouse-schema-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: clickhouse-schema-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: clickhouse/clickhouse-server:24.8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              until clickhouse-client --host clickhouse --query "SELECT 1"; do sleep 3; done
              clickhouse-client --host clickhouse --multiquery <<'SQL'
              CREATE DATABASE IF NOT EXISTS cascade;
              CREATE TABLE IF NOT EXISTS cascade.audit_events (
                  event_id String,
                  timestamp DateTime64(3),
                  event_type String,
                  subsystem String,
                  severity String,
                  run_id String,
                  correlation_id String,
                  service String,
                  namespace String,
                  actor String,
                  action String,
                  decision String,
                  status String,
                  risk_level String,
                  policy_decision_id String,
                  remediation_execution_id String,
                  verification_id String,
                  rollback_plan_id String,
                  autopilot_run_id String,
                  chaos_experiment_id String,
                  campaign_id String,
                  rca_report_id String,
                  topology_node_or_edge_id String,
                  evidence_summary String,
                  raw_payload_json String,
                  user_safe_message String
              ) ENGINE = ReplacingMergeTree(timestamp) ORDER BY (timestamp, subsystem, service, event_id);
              CREATE TABLE IF NOT EXISTS cascade.telemetry_events (
                  event_id String,
                  observed_at DateTime64(3),
                  ingested_at DateTime64(3),
                  source_topic String,
                  event_type String,
                  namespace String,
                  service String,
                  workload String,
                  pod String,
                  severity String,
                  health_status String,
                  experiment_id String,
                  trace_id String,
                  raw_json String,
                  enriched_json String,
                  labels_json String,
                  numeric_features_json String
              ) ENGINE = MergeTree ORDER BY (service, observed_at, event_id);
              CREATE TABLE IF NOT EXISTS cascade.experiment_events (
                  event_id String,
                  experiment_id String,
                  experiment_type String,
                  target_namespace String,
                  target_service String,
                  target_workload String,
                  status String,
                  started_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  observed_at DateTime64(3),
                  ingested_at DateTime64(3),
                  source_topic String,
                  event_json String
              ) ENGINE = MergeTree ORDER BY (experiment_id, observed_at, event_id);
              CREATE TABLE IF NOT EXISTS cascade.incidents (
                  incident_id String,
                  experiment_id String,
                  root_cause_service String,
                  root_cause_summary String,
                  severity String,
                  status String,
                  confidence Float64,
                  first_seen_at DateTime64(3),
                  last_seen_at DateTime64(3),
                  created_at DateTime64(3),
                  affected_services_json String,
                  causal_chain_json String,
                  evidence_json String,
                  incident_json String
              ) ENGINE = MergeTree ORDER BY (root_cause_service, first_seen_at, incident_id);
              CREATE TABLE IF NOT EXISTS cascade.incident_reports (
                  report_id String,
                  incident_id String,
                  experiment_id String,
                  generated_at DateTime64(3),
                  root_cause_service String,
                  severity String,
                  markdown_report String,
                  report_json String
              ) ENGINE = MergeTree ORDER BY (root_cause_service, generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.topology_snapshots (
                  snapshot_id String,
                  captured_at DateTime64(3),
                  topology_json String,
                  service_count UInt64,
                  edge_count UInt64
              ) ENGINE = MergeTree ORDER BY (captured_at, snapshot_id);
              CREATE TABLE IF NOT EXISTS cascade.telemetry_feature_windows (
                  window_id String,
                  service String,
                  namespace String,
                  workload String,
                  window_start DateTime64(3),
                  window_end DateTime64(3),
                  extracted_at DateTime64(3),
                  event_count UInt64,
                  unhealthy_count UInt64,
                  healthy_count UInt64,
                  restart_signal_count UInt64,
                  warning_count UInt64,
                  error_count UInt64,
                  experiment_event_count UInt64,
                  incident_context_count UInt64,
                  avg_cpu Float64,
                  max_cpu Float64,
                  avg_memory Float64,
                  max_memory Float64,
                  avg_latency_ms Float64,
                  max_latency_ms Float64,
                  latency_p50_ms Float64,
                  latency_p95_ms Float64,
                  latency_p99_ms Float64,
                  request_rate Float64,
                  error_rate Float64,
                  restart_rate Float64,
                  unhealthy_rate Float64,
                  readiness_rate Float64,
                  availability_rate Float64,
                  warning_event_count Float64,
                  missing_metric_count UInt64,
                  dependency_unhealthy_count UInt64,
                  feature_vector_json String,
                  source_query_hash String
              ) ENGINE = MergeTree ORDER BY (service, window_start, window_id);
              CREATE TABLE IF NOT EXISTS cascade.anomaly_events (
                  anomaly_id String,
                  detected_at DateTime64(3),
                  window_id String,
                  service String,
                  namespace String,
                  workload String,
                  window_start DateTime64(3),
                  window_end DateTime64(3),
                  severity String,
                  status String,
                  anomaly_score Float64,
                  risk_score Float64,
                  model_name String,
                  model_version String,
                  detector_type String,
                  is_anomaly UInt8,
                  explanation String,
                  evidence_json String,
                  feature_vector_json String,
                  related_experiment_id String,
                  published_to_redpanda UInt8
              ) ENGINE = ReplacingMergeTree(detected_at) ORDER BY (anomaly_id);
              CREATE TABLE IF NOT EXISTS cascade.causal_reports (
                  report_id String,
                  generated_at DateTime64(3),
                  target_service String,
                  target_feature String,
                  source_feature String,
                  status String,
                  summary String,
                  window_start Nullable(DateTime64(3)),
                  window_end Nullable(DateTime64(3)),
                  candidate_count UInt64,
                  methodology_json String,
                  limitations_json String,
                  report_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.causal_candidates (
                  report_id String,
                  candidate_id String,
                  generated_at DateTime64(3),
                  rank UInt64,
                  source_service String,
                  target_service String,
                  source_feature String,
                  target_feature String,
                  status String,
                  rank_score Float64,
                  best_p_value Nullable(Float64),
                  effect_size Float64,
                  lag_windows UInt64,
                  sample_count UInt64,
                  pearson_json String,
                  spearman_json String,
                  granger_json String,
                  topology_distance Nullable(Int64),
                  anomaly_context_json String,
                  limitations_json String,
                  candidate_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (report_id, rank, candidate_id);
              CREATE TABLE IF NOT EXISTS cascade.rca_reports (
                  report_id String,
                  generated_at DateTime64(3),
                  target_service String,
                  likely_root_cause_service String,
                  status String,
                  confidence_score Float64,
                  affected_services_json String,
                  related_chaos_json String,
                  evidence_json String,
                  timeline_json String,
                  limitations_json String,
                  explanation String,
                  report_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.model_runs (
                  run_id String,
                  started_at DateTime64(3),
                  completed_at DateTime64(3),
                  model_name String,
                  model_version String,
                  detector_type String,
                  windows_scored UInt64,
                  anomalies_detected UInt64,
                  status String,
                  config_json String,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (started_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_documents (
                  document_id String,
                  source_type String,
                  document_type String,
                  title String,
                  source_path String,
                  source_uri String,
                  content_hash String,
                  ingested_at DateTime64(3),
                  updated_at DateTime64(3),
                  phase String,
                  service String,
                  namespace String,
                  severity String,
                  tags_json String,
                  metadata_json String,
                  raw_content String
              ) ENGINE = ReplacingMergeTree(updated_at)
              ORDER BY (source_type, document_type, document_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_chunks (
                  chunk_id String,
                  document_id String,
                  chunk_index UInt64,
                  source_type String,
                  document_type String,
                  title String,
                  source_path String,
                  content_hash String,
                  chunk_hash String,
                  ingested_at DateTime64(3),
                  phase String,
                  service String,
                  namespace String,
                  severity String,
                  tags_json String,
                  metadata_json String,
                  chunk_text String,
                  embedding_model String,
                  qdrant_collection String,
                  qdrant_point_id String
              ) ENGINE = ReplacingMergeTree(ingested_at)
              ORDER BY (source_type, document_type, document_id, chunk_index, chunk_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_ingestion_runs (
                  run_id String,
                  started_at DateTime64(3),
                  completed_at DateTime64(3),
                  source String,
                  source_type String,
                  documents_seen UInt64,
                  documents_ingested UInt64,
                  chunks_created UInt64,
                  chunks_indexed UInt64,
                  status String,
                  config_json String,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (started_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_queries (
                  query_id String,
                  queried_at DateTime64(3),
                  query_text String,
                  filters_json String,
                  result_count UInt64,
                  top_score Float64,
                  latency_ms Float64,
                  response_json String
              ) ENGINE = MergeTree ORDER BY (queried_at, query_id);
              CREATE TABLE IF NOT EXISTS cascade.investigation_runs (
                  investigation_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  status String,
                  mode String,
                  trigger_type String,
                  trigger_id String,
                  service String,
                  namespace String,
                  severity String,
                  risk_score Float64,
                  title String,
                  objective String,
                  final_summary String,
                  confidence Float64,
                  tools_used_json String,
                  evidence_refs_json String,
                  config_json String,
                  error_message String
              ) ENGINE = ReplacingMergeTree(updated_at)
              ORDER BY (created_at, investigation_id);
              CREATE TABLE IF NOT EXISTS cascade.agent_steps (
                  step_id String,
                  investigation_id String,
                  created_at DateTime64(3),
                  node_name String,
                  agent_role String,
                  step_type String,
                  status String,
                  input_json String,
                  output_json String,
                  tool_name String,
                  tool_latency_ms Float64,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (investigation_id, created_at, step_id);
              CREATE TABLE IF NOT EXISTS cascade.investigation_reports (
                  report_id String,
                  investigation_id String,
                  generated_at DateTime64(3),
                  title String,
                  summary String,
                  suspected_root_cause String,
                  affected_services_json String,
                  evidence_json String,
                  timeline_json String,
                  anomaly_refs_json String,
                  knowledge_refs_json String,
                  recommended_next_steps_json String,
                  suggested_remediation_json String,
                  confidence Float64,
                  markdown_report String,
                  report_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (investigation_id, generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.agent_tool_calls (
                  call_id String,
                  investigation_id String,
                  called_at DateTime64(3),
                  tool_name String,
                  target_service String,
                  status String,
                  latency_ms Float64,
                  request_json String,
                  response_summary String,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (investigation_id, called_at, call_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_experiment_plans (
                  plan_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  status String,
                  plan_type String,
                  experiment_kind String,
                  target_namespace String,
                  target_service String,
                  target_workload String,
                  target_selector_json String,
                  duration_seconds UInt64,
                  blast_radius_score Float64,
                  safety_score Float64,
                  risk_level String,
                  objective String,
                  hypothesis String,
                  expected_impact String,
                  safety_policy_json String,
                  manifest_json String,
                  plan_json String
              ) ENGINE = ReplacingMergeTree(updated_at)
              ORDER BY (created_at, plan_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_experiment_runs (
                  run_id String,
                  plan_id String,
                  experiment_id String,
                  started_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  status String,
                  dry_run UInt8,
                  approved UInt8,
                  experiment_kind String,
                  target_namespace String,
                  target_service String,
                  target_workload String,
                  chaos_resource_name String,
                  chaos_resource_uid String,
                  duration_seconds UInt64,
                  cleanup_status String,
                  error_message String,
                  run_json String
              ) ENGINE = ReplacingMergeTree(started_at)
              ORDER BY (started_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_observations (
                  observation_id String,
                  run_id String,
                  plan_id String,
                  observed_at DateTime64(3),
                  observation_window_seconds UInt64,
                  telemetry_events_count UInt64,
                  anomaly_events_count UInt64,
                  incidents_count UInt64,
                  investigation_id String,
                  affected_services_json String,
                  telemetry_summary_json String,
                  anomaly_summary_json String,
                  incident_summary_json String,
                  observation_json String
              ) ENGINE = MergeTree ORDER BY (run_id, observed_at, observation_id);
              CREATE TABLE IF NOT EXISTS cascade.resilience_scores (
                  score_id String,
                  run_id String,
                  plan_id String,
                  computed_at DateTime64(3),
                  service String,
                  namespace String,
                  experiment_kind String,
                  resilience_score Float64,
                  recovery_score Float64,
                  blast_radius_score Float64,
                  anomaly_penalty Float64,
                  incident_penalty Float64,
                  evidence_score Float64,
                  grade String,
                  explanation String,
                  recommendations_json String,
                  score_json String
              ) ENGINE = ReplacingMergeTree(computed_at)
              ORDER BY (service, computed_at, score_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_safety_violations (
                  violation_id String,
                  created_at DateTime64(3),
                  plan_id String,
                  run_id String,
                  violation_type String,
                  severity String,
                  message String,
                  policy_json String,
                  request_json String
              ) ENGINE = MergeTree ORDER BY (created_at, violation_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_policy_audit (
                  audit_id String,
                  checked_at DateTime64(3),
                  plan_id String,
                  experiment_kind String,
                  namespace String,
                  service String,
                  allowed UInt8,
                  risk_level String,
                  findings_json String,
                  policy_json String
              ) ENGINE = MergeTree ORDER BY (checked_at, audit_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_campaigns (
                  campaign_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  status String,
                  name String,
                  target_namespace String,
                  allowed_services_json String,
                  experiment_templates_json String,
                  schedule_json String,
                  max_experiments_per_run UInt64,
                  blast_radius_limit Float64,
                  cooldown_seconds UInt64,
                  dry_run UInt8,
                  local_demo_execution_enabled UInt8,
                  stop_conditions_json String,
                  campaign_json String
              ) ENGINE = ReplacingMergeTree(updated_at) ORDER BY (updated_at, campaign_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_campaign_runs (
                  run_id String,
                  campaign_id String,
                  started_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  status String,
                  dry_run UInt8,
                  requested_by String,
                  experiments_attempted UInt64,
                  experiments_succeeded UInt64,
                  experiments_blocked UInt64,
                  experiments_failed UInt64,
                  services_json String,
                  report_json String,
                  error_message String,
                  run_json String
              ) ENGINE = ReplacingMergeTree(started_at) ORDER BY (started_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.chaos_campaign_steps (
                  step_id String,
                  run_id String,
                  campaign_id String,
                  created_at DateTime64(3),
                  sequence UInt64,
                  status String,
                  plan_id String,
                  chaos_run_id String,
                  experiment_kind String,
                  target_service String,
                  blocked_reason String,
                  evidence_before_json String,
                  evidence_after_json String,
                  result_json String,
                  cleanup_status String,
                  step_json String
              ) ENGINE = MergeTree ORDER BY (run_id, sequence, created_at, step_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_plans (
                  plan_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  status String,
                  trigger_type String,
                  trigger_id String,
                  source_investigation_id String,
                  source_anomaly_id String,
                  source_incident_id String,
                  source_chaos_run_id String,
                  service String,
                  namespace String,
                  severity String,
                  risk_score Float64,
                  confidence Float64,
                  action_type String,
                  action_summary String,
                  remediation_steps_json String,
                  rollback_steps_json String,
                  evidence_refs_json String,
                  safety_findings_json String,
                  dry_run_manifest_json String,
                  plan_json String
              ) ENGINE = ReplacingMergeTree(updated_at) ORDER BY (created_at, plan_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_approvals (
                  approval_id String,
                  plan_id String,
                  decided_at DateTime64(3),
                  decision String,
                  approver String,
                  approver_role String,
                  reason String,
                  expires_at Nullable(DateTime64(3)),
                  approval_metadata_json String
              ) ENGINE = MergeTree ORDER BY (plan_id, decided_at, approval_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_executions (
                  execution_id String,
                  plan_id String,
                  approval_id String,
                  started_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  status String,
                  dry_run UInt8,
                  executed UInt8,
                  action_type String,
                  namespace String,
                  service String,
                  resource_kind String,
                  resource_name String,
                  validation_status String,
                  execution_status String,
                  rollback_available UInt8,
                  output_summary String,
                  error_message String,
                  execution_json String
              ) ENGINE = ReplacingMergeTree(started_at) ORDER BY (started_at, execution_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_rollback_plans (
                  rollback_plan_id String,
                  execution_id String,
                  plan_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  action_type String,
                  namespace String,
                  service String,
                  rollback_type String,
                  available UInt8,
                  auto_executable UInt8,
                  status String,
                  reason String,
                  snapshot_json String,
                  actions_json String,
                  result_json String,
                  rollback_plan_json String
              ) ENGINE = ReplacingMergeTree(updated_at) ORDER BY (created_at, rollback_plan_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_verification_results (
                  verification_id String,
                  execution_id String,
                  plan_id String,
                  rollback_plan_id String,
                  created_at DateTime64(3),
                  completed_at DateTime64(3),
                  action_type String,
                  namespace String,
                  service String,
                  status String,
                  evidence_quality String,
                  rollback_status String,
                  summary String,
                  before_json String,
                  after_json String,
                  comparisons_json String,
                  limitations_json String,
                  rollback_json String,
                  verification_json String
              ) ENGINE = ReplacingMergeTree(completed_at) ORDER BY (completed_at, verification_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_safety_violations (
                  violation_id String,
                  created_at DateTime64(3),
                  plan_id String,
                  execution_id String,
                  violation_type String,
                  severity String,
                  message String,
                  policy_json String,
                  request_json String
              ) ENGINE = MergeTree ORDER BY (created_at, violation_id);
              CREATE TABLE IF NOT EXISTS cascade.remediation_policy_audit (
                  audit_id String,
                  checked_at DateTime64(3),
                  plan_id String,
                  action_type String,
                  namespace String,
                  service String,
                  allowed UInt8,
                  risk_level String,
                  findings_json String,
                  policy_json String
              ) ENGINE = MergeTree ORDER BY (checked_at, audit_id);
              CREATE TABLE IF NOT EXISTS cascade.autopilot_runs (
                  run_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  status String,
                  final_result String,
                  mode String,
                  trigger_type String,
                  trigger_id String,
                  service String,
                  namespace String,
                  objective String,
                  anomaly_id String,
                  investigation_id String,
                  remediation_plan_id String,
                  approval_id String,
                  dry_run_execution_id String,
                  execution_id String,
                  proposed_action String,
                  error_message String,
                  evidence_json String,
                  recommendation_json String,
                  action_json String,
                  verification_json String,
                  run_json String
              ) ENGINE = ReplacingMergeTree(updated_at) ORDER BY (created_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.autopilot_steps (
                  step_id String,
                  run_id String,
                  created_at DateTime64(3),
                  state String,
                  status String,
                  summary String,
                  input_json String,
                  output_json String,
                  error_message String,
                  step_json String
              ) ENGINE = MergeTree ORDER BY (run_id, created_at, step_id);
              CREATE TABLE IF NOT EXISTS cascade.scheduler_items (
                  item_id String,
                  item_type String,
                  target_id String,
                  name String,
                  schedule_json String,
                  enabled UInt8,
                  paused UInt8,
                  mode String,
                  next_run_at Nullable(DateTime64(3)),
                  last_run_at Nullable(DateTime64(3)),
                  cooldown_seconds UInt64,
                  max_runs_per_window UInt64,
                  window_seconds UInt64,
                  failure_count UInt64,
                  status String,
                  payload_json String,
                  updated_at DateTime64(3)
              ) ENGINE = ReplacingMergeTree(updated_at) ORDER BY (item_id);
              CREATE TABLE IF NOT EXISTS cascade.scheduler_decisions (
                  decision_id String,
                  item_id String,
                  item_type String,
                  target_id String,
                  evaluated_at DateTime64(3),
                  due_at Nullable(DateTime64(3)),
                  status String,
                  action String,
                  reason String,
                  idempotency_key String,
                  run_id String,
                  dry_run UInt8,
                  skipped_missed_windows UInt64,
                  payload_json String,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (item_id, evaluated_at, decision_id);
              ALTER TABLE cascade.telemetry_events MODIFY TTL toDateTime(observed_at) + INTERVAL 14 DAY DELETE;
              ALTER TABLE cascade.telemetry_feature_windows MODIFY TTL toDateTime(window_end) + INTERVAL 45 DAY DELETE;
              ALTER TABLE cascade.anomaly_events MODIFY TTL toDateTime(detected_at) + INTERVAL 90 DAY DELETE;
              ALTER TABLE cascade.experiment_events MODIFY TTL toDateTime(observed_at) + INTERVAL 90 DAY DELETE;
              ALTER TABLE cascade.model_runs MODIFY TTL toDateTime(completed_at) + INTERVAL 90 DAY DELETE;
              SQL
