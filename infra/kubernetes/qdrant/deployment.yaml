apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: cascade-system
  labels:
    app: qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
          env:
            - name: QDRANT__SERVICE__MAX_WORKERS
              value: "2"
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
              value: "2"
            - name: QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
