apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-center
  namespace: cascade-system
  labels:
    app: command-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-center
  template:
    metadata:
      labels:
        app: command-center
    spec:
      containers:
        - name: command-center
          image: cascade-command-center:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8030
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
