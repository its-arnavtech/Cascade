apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: cascade-system
  labels:
    app: redpanda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
          command:
            - rpk
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --overprovisioned
            - --default-log-level=warn
            - --smp
            - "1"
            - --memory
            - 768M
            - --reserve-memory
            - 0M
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda.cascade-system.svc.cluster.local:9092
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          startupProbe:
            tcpSocket:
              port: kafka
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 10
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: redpanda-data
