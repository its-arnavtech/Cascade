apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topics-init
  namespace: cascade-system
  labels:
    app: redpanda-topics-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: redpanda-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics-init
          image: redpandadata/redpanda:v24.3.5
          imagePullPolicy: IfNotPresent
          env:
            - name: REDPANDA_BROKERS
              value: redpanda.cascade-system.svc.cluster.local:9092
          command:
            - /bin/bash
            - -ec
            - |
              until rpk -X brokers="${REDPANDA_BROKERS}" cluster info >/dev/null 2>&1; do
                echo "Waiting for Redpanda Kafka API at ${REDPANDA_BROKERS}..."
                sleep 5
              done

              configure_topic() {
                topic="$1"
                retention_ms="$2"
                retention_bytes="$3"
                rpk -X brokers="${REDPANDA_BROKERS}" topic create "${topic}" -c cleanup.policy=delete -c retention.ms="${retention_ms}" -c retention.bytes="${retention_bytes}" || true
                rpk -X brokers="${REDPANDA_BROKERS}" topic alter-config "${topic}" --set cleanup.policy=delete --set retention.ms="${retention_ms}" --set retention.bytes="${retention_bytes}" || true
                rpk -X brokers="${REDPANDA_BROKERS}" topic describe "${topic}" >/dev/null
              }

              configure_topic telemetry.raw 604800000 536870912
              configure_topic telemetry.enriched 1209600000 1073741824
              configure_topic experiments.events 7776000000 268435456
              configure_topic anomalies.detected 7776000000 268435456
              configure_topic agent.investigations 15552000000 268435456
              configure_topic chaos.experiments 15552000000 268435456
              configure_topic remediation.actions 15552000000 268435456
              configure_topic causality.reports 15552000000 268435456
              configure_topic autopilot.runs 15552000000 268435456

              for topic in telemetry.raw telemetry.enriched experiments.events anomalies.detected agent.investigations chaos.experiments remediation.actions causality.reports autopilot.runs; do
                rpk -X brokers="${REDPANDA_BROKERS}" topic describe "${topic}" >/dev/null
              done

              rpk -X brokers="${REDPANDA_BROKERS}" topic list
