apiVersion: v1
kind: ServiceAccount
metadata:
  name: observation-service
  namespace: cascade-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observation-service-pod-reader
  namespace: cascade-targets
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observation-service-pod-reader
  namespace: cascade-targets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observation-service-pod-reader
subjects:
  - kind: ServiceAccount
    name: observation-service
    namespace: cascade-system
