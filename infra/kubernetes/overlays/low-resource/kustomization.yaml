apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 384Mi
  - target:
      kind: Deployment
      name: command-center
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
  - target:
      kind: Deployment
      name: command-center-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
  - target:
      kind: Deployment
      name: anomaly-detector-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 700m
            memory: 768Mi
  - target:
      kind: Deployment
      name: retrieval-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 75m
            memory: 160Mi
          limits:
            cpu: 400m
            memory: 512Mi
  - target:
      kind: Deployment
      name: memory-indexer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 75m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 512Mi
  - target:
      kind: Deployment
      name: clickhouse
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 700m
            memory: 1Gi
  - target:
      kind: Deployment
      name: redpanda
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/9
        value: 512M
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 150m
            memory: 384Mi
          limits:
            cpu: 700m
            memory: 768Mi
  - target:
      kind: Deployment
      name: qdrant
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 75m
            memory: 256Mi
          limits:
            cpu: 600m
            memory: 768Mi
  - target:
      kind: PersistentVolumeClaim
      name: clickhouse-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 4Gi
  - target:
      kind: PersistentVolumeClaim
      name: redpanda-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: PersistentVolumeClaim
      name: qdrant-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
