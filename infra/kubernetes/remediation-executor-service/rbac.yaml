apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-executor-service
  namespace: cascade-system
  labels:
    app: remediation-executor-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-executor-targets
  namespace: cascade-targets
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos", "networkchaos", "stresschaos"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-executor-targets
  namespace: cascade-targets
subjects:
  - kind: ServiceAccount
    name: remediation-executor-service
    namespace: cascade-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-executor-targets
