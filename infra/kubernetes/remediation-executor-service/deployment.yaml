apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-executor-service
  namespace: cascade-system
  labels:
    app: remediation-executor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-executor-service
  template:
    metadata:
      labels:
        app: remediation-executor-service
    spec:
      serviceAccountName: remediation-executor-service
      containers:
        - name: remediation-executor-service
          image: cascade-remediation-executor-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8023
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: REMEDIATION_EVENTS_TOPIC
              value: remediation.actions
            - name: EXECUTION_ENABLED
              value: "false"
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 640Mi

