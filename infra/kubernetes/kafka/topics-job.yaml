apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: cascade-system
  labels:
    app: kafka-topics-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics-init
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.cascade-system.svc.cluster.local:9092
          command:
            - /bin/bash
            - -ec
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" --list >/dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 5
              done

              for topic in telemetry.raw telemetry.enriched experiments.events; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                  --create \
                  --if-not-exists \
                  --topic "${topic}" \
                  --partitions 1 \
                  --replication-factor 1
              done

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" --list
