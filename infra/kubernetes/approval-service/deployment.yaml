apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-service
  namespace: cascade-system
  labels:
    app: approval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approval-service
  template:
    metadata:
      labels:
        app: approval-service
    spec:
      containers:
        - name: approval-service
          image: cascade-approval-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8022
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: REMEDIATION_EVENTS_TOPIC
              value: remediation.actions
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 80m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi

