---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: cascade-system
  labels:
    app: qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
          env:
            - name: QDRANT__SERVICE__MAX_WORKERS
              value: "2"
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
              value: "2"
            - name: QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: cascade-system
  labels:
    app: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-collection-init
  namespace: cascade-system
  labels:
    app: qdrant-collection-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: qdrant-collection-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              until curl -sf http://qdrant:6333/readyz; do sleep 3; done
              code="$(curl -s -o /tmp/qdrant-init-response -w '%{http_code}' -X PUT http://qdrant:6333/collections/cascade_incident_memory \
                -H 'Content-Type: application/json' \
                --data '{"vectors":{"size":128,"distance":"Cosine"},"optimizers_config":{"indexing_threshold":1000}}')"
              if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then
                cat /tmp/qdrant-init-response
              else
                cat /tmp/qdrant-init-response
                exit 1
              fi
              curl -sf -X PATCH http://qdrant:6333/collections/cascade_incident_memory \
                -H 'Content-Type: application/json' \
                --data '{"optimizers_config":{"indexing_threshold":1000}}'
              code="$(curl -s -o /tmp/qdrant-knowledge-init-response -w '%{http_code}' -X PUT http://qdrant:6333/collections/cascade_knowledge_base \
                -H 'Content-Type: application/json' \
                --data '{"vectors":{"size":128,"distance":"Cosine"},"optimizers_config":{"indexing_threshold":1000}}')"
              if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then
                cat /tmp/qdrant-knowledge-init-response
                curl -sf -X PATCH http://qdrant:6333/collections/cascade_knowledge_base \
                  -H 'Content-Type: application/json' \
                  --data '{"optimizers_config":{"indexing_threshold":1000}}'
                exit 0
              fi
              cat /tmp/qdrant-knowledge-init-response
              exit 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observation-service
  namespace: cascade-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observation-service-pod-reader
  namespace: cascade-targets
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observation-service-pod-reader
  namespace: cascade-targets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observation-service-pod-reader
subjects:
  - kind: ServiceAccount
    name: observation-service
    namespace: cascade-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observation-service
  namespace: cascade-system
  labels:
    app: observation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observation-service
  template:
    metadata:
      labels:
        app: observation-service
    spec:
      serviceAccountName: observation-service
      containers:
        - name: observation-service
          image: cascade-observation-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
            - name: TARGET_NAMESPACE
              value: cascade-targets
            - name: TELEMETRY_PUBLISH_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: KAFKA_RAW_TOPIC
              value: telemetry.raw
            - name: TELEMETRY_PUBLISH_INTERVAL_SECONDS
              value: "10"
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: observation-service
  namespace: cascade-system
  labels:
    app: observation-service
spec:
  type: ClusterIP
  selector:
    app: observation-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
