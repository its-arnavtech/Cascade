apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-test
  labels:
    app: load-test
    app.kubernetes.io/name: load-test
    app.kubernetes.io/part-of: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-test
  template:
    metadata:
      labels:
        app: load-test
        app.kubernetes.io/name: load-test
        app.kubernetes.io/part-of: sock-shop
    spec:
      initContainers:
        - name: wait-for-front-end
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -T 2 -O /dev/null http://front-end/; do
                echo "waiting for front-end"
                sleep 2
              done
      containers:
        - name: load-test
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              while true; do
                curl -fsS http://front-end/ >/dev/null || true
                curl -fsS http://front-end/catalogue >/dev/null || true
                sleep 2
              done
          env:
            - name: HOST
              value: http://front-end.cascade-targets.svc.cluster.local
            - name: USERS
              value: "10"
            - name: RATE
              value: "2"
