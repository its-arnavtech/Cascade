apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  labels: &front-end-labels
    app: front-end
    app.kubernetes.io/name: front-end
    app.kubernetes.io/part-of: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      labels: *front-end-labels
    spec:
      containers:
        - name: front-end
          image: weaveworksdemos/front-end:0.3.12
          ports:
            - containerPort: 8079
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  labels:
    app: front-end
    app.kubernetes.io/name: front-end
    app.kubernetes.io/part-of: sock-shop
spec:
  type: ClusterIP
  selector:
    app: front-end
  ports:
    - name: http
      port: 80
      targetPort: 8079
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  labels: &catalogue-labels
    app: catalogue
    app.kubernetes.io/name: catalogue
    app.kubernetes.io/part-of: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels: *catalogue-labels
    spec:
      containers:
        - name: catalogue
          image: weaveworksdemos/catalogue:0.3.5
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: catalogue-db
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  labels:
    app: catalogue
    app.kubernetes.io/name: catalogue
    app.kubernetes.io/part-of: sock-shop
spec:
  selector:
    app: catalogue
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-db
  labels: &catalogue-db-labels
    app: catalogue-db
    app.kubernetes.io/name: catalogue-db
    app.kubernetes.io/part-of: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue-db
  template:
    metadata:
      labels: *catalogue-db-labels
    spec:
      containers:
        - name: catalogue-db
          image: weaveworksdemos/catalogue-db:0.3.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              # Demo-only local value required by the Sock Shop catalogue-db image; not a production secret.
              value: demo-only-not-secret
            - name: MYSQL_DATABASE
              value: socksdb
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  labels:
    app: catalogue-db
    app.kubernetes.io/name: catalogue-db
    app.kubernetes.io/part-of: sock-shop
spec:
  selector:
    app: catalogue-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
