image:
  repository: otel/opentelemetry-collector-contrib
  tag: latest

mode: daemonset

presets:
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true
  logsCollection:
    enabled: false

config:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
  exporters:
    debug: {}
  service:
    pipelines:
      metrics:
        receivers: [otlp]
        exporters: [debug]
      traces:
        receivers: [otlp]
        exporters: [debug]
      logs:
        receivers: [otlp]
        exporters: [debug]